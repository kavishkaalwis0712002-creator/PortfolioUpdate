name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Prepare for Static Export
        run: |
          if [ -d "app/api" ]; then
            mv app/api ./_temp_api
          fi
          if [ -d "app/admin" ]; then
            mv app/admin ./_temp_admin
          fi

      - name: Build Next.js
        run: npx next build

      - name: Restore Backend Folders
        if: always()
        run: |
          if [ -d "./_temp_api" ]; then
            mv ./_temp_api app/api
          fi
          if [ -d "./_temp_admin" ]; then
            mv ./_temp_admin app/admin
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
